name: iOS TestFlight

# Manual trigger only. macOS runner minutes are limited (and cost 10x on a
# private repo), so we build on demand, not on every push. Run it from the
# repo's "Actions" tab -> "iOS TestFlight" -> "Run workflow".
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15          # Apple Silicon runner
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to the latest stable Xcode so the build uses a current SDK
      # (App Store submissions require a recent SDK).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Build the web bundle and copy it into the iOS project. This also runs
      # `pod install` using the runner's preinstalled CocoaPods (system Ruby),
      # BEFORE we switch Ruby for Fastlane below.
      - name: Build web bundle + sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Build and upload to TestFlight
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta

      # Keep the .ipa + logs for download if something goes wrong.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/App/*.ipa
            ios/App/fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7
