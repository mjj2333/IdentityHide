<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PixelShield — Protect Identities in Photos</title>
    <meta name="description" content="Auto-detect faces, strip metadata, and blur sensitive areas — all on-device, no uploads." />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PixelShield" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Unregister any service workers that may be caching old content
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            reg.unregister();
            console.log('UNREGISTERED SERVICE WORKER:', reg.scope);
          });
          if (registrations.length > 0) {
            console.log('Service workers cleared - reloading...');
            location.reload();
          }
        });
      }
      // Cache-bust timestamp to confirm fresh load
      console.log('=== INDEX.HTML LOADED AT:', new Date().toISOString(), '===');
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
