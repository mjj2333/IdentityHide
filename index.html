<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- One-time auto-migration for users still landing on the legacy Netlify
         subdomain (pre-rebrand bookmarks, pre-rebrand PWA installs). Runs
         synchronously before any other scripts so the redirect happens before
         React mounts or the service worker takes over. Preserves path, query,
         and hash. Remove once analytics show no more traffic on the old host. -->
    <script>
      if (location.hostname === 'identityhide.netlify.app') {
        location.replace('https://redactid.app' + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Redact.ID | Share photos without revealing who you are</title>
    <meta name="description" content="Redact.ID protects identities in photos. Blur faces, remove tattoos, and strip location metadata in your browser before you share." />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Redact.ID" />
    <link rel="manifest" href="/manifest.json" />
    <!-- SVG favicon first for modern browsers (scales crisp at every tab size
         and auto-adapts stroke color to the browser chrome). PNG fallback
         stays for older browsers and any OS that doesn't grok SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta property="og:title" content="Redact.ID | Share photos without revealing who you are" />
    <meta property="og:description" content="Redact.ID protects identities in photos. Blur faces, remove tattoos, and strip location metadata in your browser before you share." />
    <meta property="og:image" content="https://redactid.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Redact.ID: private photo redaction in your browser" />
    <meta property="og:url" content="https://redactid.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://redactid.app/og-image.png" />
    <meta name="google-adsense-account" content="ca-pub-5282264563005092">
    <meta name="msvalidate.01" content="7C9A7E6D6E6D590ADFC9E7515B6AC83E" />
    <link rel="canonical" href="https://redactid.app/" />
    <!-- Schema.org structured data: helps Google parse the site as a
         WebApplication and surface richer search results (sitelinks, app
         category, free price). Updated per-route by useDocumentMeta where
         meaningful; the in-head block is the home/default. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Redact.ID",
      "url": "https://redactid.app",
      "description": "Browser-based photo redaction. Blur faces, remove tattoos, and strip location metadata before sharing, all client-side and free.",
      "applicationCategory": "PhotoApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and a modern browser",
      "image": "https://redactid.app/og-image.png",
      "screenshot": "https://redactid.app/og-image.png",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Face blur with on-device AI",
        "Tattoo removal via AI inpainting",
        "EXIF and location metadata stripping",
        "Batch processing"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Redact.ID",
        "url": "https://redactid.app"
      }
    }
    </script>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <!-- AppLixir rewarded video ads -->
    <div id="applixir-ad"></div>
    <script>
      // GPP (Global Privacy Platform) stub — AppLixir's ad stack expects
      // this to exist. Without it the SDK throws a TypeError.
      if (typeof window.__gpp !== 'function') {
        window.__gpp = function() {};
      }
    </script>
    <!-- async: don't block HTML parsing while this third-party SDK downloads.
         AppLixir is only invoked when the user taps "Watch ad" inside the
         PaywallModal, which can't fire until after the React app mounts and
         the user interacts — so by the time we need the SDK it's long since
         loaded. rewardedAd.js logs a warning + skips gracefully if the SDK
         isn't ready, so racey cases are non-fatal. -->
    <script type="text/javascript" async src="https://cdn.applixir.com/applixir.app.v6.0.1.js"></script>
    <script>
      // Service worker registration lives in src/hooks/usePwaUpdate.js so the
      // React app can also detect new versions and prompt the user to reload.
      // This inline script now only captures the install prompt early, so the
      // React InstallPrompt component never misses the event.
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <script>
      // Debug toggles — independent of each other, persisted per-tab:
      //   ?debug=1 → load Eruda (floating DevTools console for mobile).
      //   ?panel=1 → show the in-app [ClickadillaAd]/[vast-proxy] log
      //     panel at the bottom of the screen.
      // Either flag, once set, persists in sessionStorage for the tab.
      // Remove this whole block (and CSP allowance for jsdelivr, when CSP
      // flips to enforcing) before shipping to production.
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('debug') === '1') sessionStorage.setItem('ih_debug', '1');
          if (params.get('panel') === '1') sessionStorage.setItem('ih_debug_panel', '1');
          if (sessionStorage.getItem('ih_debug') !== '1') return;
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/eruda';
          s.onload = function() { try { window.eruda && window.eruda.init(); } catch (e) {} };
          document.head.appendChild(s);
        } catch (e) { /* sessionStorage unavailable — no debug console */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
