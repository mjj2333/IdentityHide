<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 44" fill="none">
  <style>
    /* Stroke color tracks the browser chrome so the mark is legible on
       both light and dark tab backgrounds. The accent redaction bar
       stays crimson in both themes. */
    :root { --mark: #1c1a15; --accent: oklch(0.62 0.22 22); }
    @media (prefers-color-scheme: dark) { :root { --mark: #f5efe4; } }
    .stroke { stroke: var(--mark); }
    .accent { stroke: var(--accent); }
  </style>
  <!-- Shield outline -->
  <path class="stroke" d="M20 2 L35 7 V22 C35 31 28 38 20 42 C12 38 5 31 5 22 V7 Z"
        stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Hat brim -->
  <path class="stroke" d="M11.5 17 H28.5" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Hat crown -->
  <path class="stroke" d="M15 17 C15 13 17 11 20 11 C23 11 25 13 25 17"
        stroke-width="1.75" stroke-linecap="round"/>
  <!-- Face silhouette -->
  <path class="stroke" d="M14 17 C14 22 16 26 20 28 C24 26 26 22 26 17"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Redaction bar — the Redact.ID mark's hook -->
  <path class="accent" d="M16 21.5 L24 21.5" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Collar -->
  <path class="stroke" d="M15 33 L20 30 L25 33"
        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
