<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redact.ID — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 360px; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #999999; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
    button {
      background: #e8384f;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're offline</h1>
    <p>Redact.ID needs a connection to load. Once the app is running, face blur and metadata stripping work without internet — only tattoo removal requires the network.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
