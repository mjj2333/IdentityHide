[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feedback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

# Post-Stripe-Checkout landing. EntitlementContext reads ?session_id= and
# swaps the URL back to / after confirming the subscription.
[[redirects]]
  from = "/success"
  to = "/index.html"
  status = 200

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # HSTS: force HTTPS for 1 year. Netlify already redirects http→https; this
    # hardens against downgrade attacks after the first visit.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy is Report-Only for now — AppLixir (via Google
    # IMA) and Clickadilla impression pixels / ad videos both pull from
    # third-party domains chosen at runtime, so the full allowlist isn't known
    # until real traffic runs through this. Violations log to the browser
    # console; flip the header name to Content-Security-Policy (drop the
    # "-Report-Only" suffix) once a draft deploy has loaded an AppLixir
    # rewarded ad + a Clickadilla interstitial with no violation reports.
    #
    # Why each concession is here:
    # - 'unsafe-inline' in script-src: two inline blocks in index.html
    #   (window.__gpp stub + beforeinstallprompt capture).
    # - 'wasm-unsafe-eval': TensorFlow.js / BlazeFace WASM backend.
    # - 'unsafe-inline' in style-src: React inline style props + the style
    #   assignments in clickadillaAd.js for the ad overlay.
    # - img-src https:: VAST impression pixels come from arbitrary tracker
    #   domains. Tightening this requires sandboxing ads into an iframe.
    # - media-src https:: Clickadilla video URLs come from whatever CDN the
    #   winning advertiser uses. Same story as impression pixels.
    # - connect-src lists: ComfyUI tunnel (identity-hide.com, ws for progress),
    #   AppLixir SDK + ad endpoints, Sentry ingest, tfhub.dev + Google Cloud
    #   Storage + kaggle.com (BlazeFace model weights — tfhub now redirects
    #   model downloads to Kaggle's CDN).
    # - Adsterra popunder script loads from profitablecpmratenetwork.com;
    #   opened popunders are cross-origin window.open (not iframed), so no
    #   frame-src entry is needed — script-src + connect-src cover it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.applixir.com https://*.applixir.com https://*.profitablecpmratenetwork.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://identity-hide.com wss://identity-hide.com https://cdn.applixir.com https://*.applixir.com https://*.profitablecpmratenetwork.com https://o4511186341658625.ingest.us.sentry.io https://tfhub.dev https://storage.googleapis.com https://www.kaggle.com https://kaggle.com https://api.stripe.com https://checkout.stripe.com https://m.stripe.network; font-src 'self' data:; frame-src https://*.applixir.com https://checkout.stripe.com https://js.stripe.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'"

# Cache ONNX models for 1 year — they're versioned by filename
[[headers]]
  for = "/models/*.onnx"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache WASM files for 1 year
[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed JS/CSS assets — cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CORS for native shells. The Android (https://localhost) and iOS
# (capacitor://localhost) Capacitor WebViews make cross-origin requests
# against the deployed functions. Without these headers the browser blocks
# the response and the call fails with "Unexpected token '<'" (the SPA
# fallback HTML coming back as a fake function body).
#
# Allow-Origin "*" is safe here because: (a) we don't use cookies for auth
# (admin uses Authorization: Bearer; entitlement is plain GET), (b)
# checkOrigin in rateLimit.js still rejects unrecognized callers at the
# function level, and (c) all sensitive endpoints layer on rate-limit +
# password lockout. CORS is not the auth boundary.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"

# Apple App Site Association — Universal Links handshake. Apple fetches this
# file when the iOS app installs to verify the domain. It must be served as
# application/json with NO redirects in the request path. The file itself
# lives at public/.well-known/apple-app-site-association (no extension).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Android App Links — equivalent of Apple's AASA. Google's Digital Asset
# Links verifier fetches this when the Android app installs (and Play Store
# verifies it server-side at upload time). Must be application/json.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
